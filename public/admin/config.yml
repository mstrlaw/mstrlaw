backend:
  name: github
  repo: mstrlaw/mstrlaw
  branch: main

media_folder: "public/images/uploads" # Media files are stored in the repo here
public_folder: "/images/uploads" # The src attribute for uploaded media begins with this

collections:
  - name: "posts" # Used in routes, e.g., /admin/collections/posts
    label: "Posts" # Used in the UI
    folder: "src/pages/posts/" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    extension: "md"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "Layout", name: "layout", widget: "hidden", default: "/src/layouts/PostLayout.astro" }
      # Content
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "markdown", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      # Feat Image
      - { label: "Featured Image", name: "feat_image", widget: "image", required: false }
      - { label: "Featured Image Alt", name: "feat_image_alt", widget: "string", required: false }
      - { label: "Hide Featured Image", name: "hide_feat_image", widget: "boolean", required: false, default: false }
      # SEO related
      - { label: "Description (SEO)", name: "description", widget: "string", required: false }
      # Date
      - { label: "Publish Date", name: "publish_date", widget: "datetime" }
      - { label: "Update Date", name: "update_date", widget: "datetime" }
      # Type
      - {
          label: "Type",
          name: "type",
          widget: "list",
          default: ["post"]
        }
      # Legacy fields — unused by any template, kept so editing old posts
      # doesn't silently strip them. Safe to delete once the 5 posts that
      # still carry them are cleaned up.
      - { label: "Legacy Date", name: "date", widget: "datetime", required: false }
      - { label: "Legacy Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Legacy Thumbnail Description", name: "thumbnail_description", widget: "string", required: false }
