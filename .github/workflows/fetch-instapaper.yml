name: Fetch external data

on:
  schedule:
    # Run daily at 11:47 PM UTC
    - cron: '47 23 * * *'
  workflow_dispatch: # Allow manual triggers
  push:
    branches:
      - main
    paths-ignore:
      - 'public/data/instapaper/**'
      - 'public/data/mastodon/**'

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Instapaper bookmarks
        env:
          INSTAPAPER_CONSUMER_KEY: ${{ secrets.INSTAPAPER_CONSUMER_KEY }}
          INSTAPAPER_CONSUMER_SECRET: ${{ secrets.INSTAPAPER_CONSUMER_SECRET }}
          INSTAPAPER_ACCESS_TOKEN: ${{ secrets.INSTAPAPER_ACCESS_TOKEN }}
          INSTAPAPER_ACCESS_TOKEN_SECRET: ${{ secrets.INSTAPAPER_ACCESS_TOKEN_SECRET }}
        run: node scripts/fetch-instapaper.mjs

      # Don't let a flaky Mastodon instance block the bookmark commit below
      - name: Fetch Mastodon statuses
        continue-on-error: true
        run: node scripts/fetch-mastodon.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || (git commit -m "Update external data" && git push)
